{% if page.paginator.num_pages > 1 %}
<div class="pager">
  {% if page.has_previous %}<a href="?{% if params %}{{ params }}&{% endif %}page={{ page.previous_page_number }}">&laquo; Prev</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% if params %}{{ params }}&{% endif %}page={{ page.next_page_number }}">Next &raquo;</a>{% endif %}
</div>
{% endif %}
